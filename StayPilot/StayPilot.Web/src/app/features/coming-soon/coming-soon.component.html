<div class="page">
  <app-page-header [title]="info.title" [sub]="info.description">
    <span actions class="badge badge-soon">Planned</span>
  </app-page-header>

  <section class="card">
    <div class="card-head">
      <span class="card-title">Waiting on</span>
    </div>
    <div class="card-body">
      <p class="hint">{{ info.needs }}</p>
    </div>
  </section>
</div>
