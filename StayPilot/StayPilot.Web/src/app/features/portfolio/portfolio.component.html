<div class="page">
  <app-page-header title="My properties" [sub]="sub()" />

  <app-segmented
    label="What to see about your properties"
    [options]="lenses"
    [value]="lens()"
    (valueChange)="pickLens($event)"
  />

  @switch (lens()) {
    @case ('properties') {
      <app-owned-properties />
    }
    @case ('valuation') {
      <app-valuation />
    }
  }
</div>
