<div class="page">
  <app-page-header title="Calculators" i18n-title="@@core.nav.tools.title" [sub]="sub()" />

  <app-segmented
    label="Which tool"
    i18n-label="@@hub.tools.segmented.aria"
    [options]="lenses"
    [value]="lens()"
    (valueChange)="pickLens($event)"
  />

  @switch (lens()) {
    @case ('features') {
      <app-premium-features />
    }
    @case ('build') {
      <app-build-cost />
    }
  }
</div>
