<div class="page">
  <app-page-header
    title="StayPilot Comps"
    sub="Private market intelligence for the Algarve, built from scraped Idealista adverts. Median over average, sample size always shown, asking prices never dressed up as sale prices."
  />

  @for (section of sections; track section.title) {
    <section class="card">
      <div class="card-head">
        <span class="card-title">{{ section.title }}</span>
        <span class="meta">{{ section.hint }}</span>
      </div>
      <div class="card-body">
        <div class="module-grid">
          @for (m of section.modules; track m.title) {
            <a class="module" [routerLink]="m.link" [class.module-planned]="!m.live">
              <span class="module-head">
                <span class="module-title">{{ m.title }}</span>
                @if (!m.live) {
                  <span class="badge badge-soon">Planned</span>
                }
              </span>
              <span class="module-desc">{{ m.description }}</span>
            </a>
          }
        </div>
      </div>
    </section>
  }
</div>
