<div class="page">
  <app-page-header [title]="group.title" [sub]="'Everything under ' + group.title + '.'" />

  <div class="feature-grid">
    @for (link of group.links; track link.path) {
      <a class="feature-card" [routerLink]="link.path" [class.feature-card-planned]="link.planned">
        <span class="feature-card-head">
          <span class="feature-card-title-group">
            <span class="feature-card-title">{{ link.title }}</span>
            @if (link.planned) {
              <span class="badge badge-soon">Planned</span>
            }
          </span>
          <svg class="feature-card-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </span>
        <span class="feature-card-desc">{{ link.desc }}</span>
      </a>
    }
  </div>
</div>
