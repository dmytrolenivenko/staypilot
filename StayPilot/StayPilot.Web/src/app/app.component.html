<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/">
      <span class="brand-mark">SP</span>
      <span class="brand-text">
        <span class="brand-title">StayPilot</span>
        <span class="brand-sub">Comps · Algarve</span>
      </span>
    </a>

    <nav>
      <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Overview
      </a>

      <span class="nav-group">Listings</span>
      <a class="nav-link" routerLink="/listing-browser" routerLinkActive="active">Browse</a>
      <a class="nav-link" routerLink="/listings/top-deals" routerLinkActive="active">Top deals</a>
      <a class="nav-link" routerLink="/listings/lookup" routerLinkActive="active">Look up by id</a>
      <a class="nav-link" routerLink="/listings/investment-analysis" routerLinkActive="active">Investment analysis</a>

      <span class="nav-group">Market areas</span>
      <a class="nav-link" routerLink="/market-overview" routerLinkActive="active">Market overview</a>
      <a class="nav-link" routerLink="/market-areas/leaderboard" routerLinkActive="active">Leaderboard</a>
      <a class="nav-link" routerLink="/market-areas/budget" routerLinkActive="active">What money buys</a>
      <a class="nav-link" routerLink="/market-areas/neighbours" routerLinkActive="active">Neighbour gaps</a>
      <a class="nav-link" routerLink="/market-areas/renovation" routerLinkActive="active">Renovation upside</a>

      <span class="nav-group">My portfolio</span>
      <a class="nav-link" routerLink="/my-properties" routerLinkActive="active">My properties</a>
      <a class="nav-link" routerLink="/valuation" routerLinkActive="active">Valuation</a>

      <span class="nav-group">Tools</span>
      <a class="nav-link" routerLink="/feature-impact" routerLinkActive="active">Feature impact</a>
      <a class="nav-link" routerLink="/build-cost" routerLinkActive="active">Build cost</a>

      <span class="nav-group">Planned</span>
      <a class="nav-link planned" routerLink="/beach-proximity" routerLinkActive="active">Beach proximity</a>
    </nav>

    <button type="button" class="theme-toggle" (click)="toggleTheme()">
      {{ theme() === 'light' ? '◐ Dark' : '◑ Light' }}
    </button>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
