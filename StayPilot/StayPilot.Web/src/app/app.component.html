<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-title">StayPilot</span>
      <span class="brand-sub">Comps</span>
    </div>

    <button type="button" class="theme-toggle" (click)="toggleTheme()">
      {{ theme() === 'light' ? 'Dark mode' : 'Light mode' }}
    </button>

    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>

      <span class="nav-group-label">Data</span>
      <a routerLink="/market-areas" routerLinkActive="active">Market Areas</a>
      <a routerLink="/listings/lookup" routerLinkActive="active">Listing Lookup</a>
      <a routerLink="/listings/new" routerLinkActive="active">Add Listing</a>
      <a routerLink="/listing-browser" routerLinkActive="active">Listing Browser</a>
      <a routerLink="/price-history" routerLinkActive="active">Price Snapshots</a>
      <a routerLink="/my-properties" routerLinkActive="active">My Properties</a>

      <span class="nav-group-label">Analysis</span>
      <a routerLink="/feature-impact" routerLinkActive="active">Feature Impact</a>
      <a routerLink="/valuation" routerLinkActive="active">Valuation</a>
      <a routerLink="/build-cost" routerLinkActive="active">Build Cost</a>

      <span class="nav-group-label">Planned</span>
      <a routerLink="/market-overview" routerLinkActive="active">Market Overview</a>
      <a routerLink="/beach-proximity" routerLinkActive="active">Beach Proximity</a>
    </nav>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
