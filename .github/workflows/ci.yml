name: BuildDev                             # the name you see in the Actions tab

on:                                        # when does this workflow run?
  pull_request:                            # only for pull requests...
    branches: [ master, stable, release ]  # gate you pass before merging

jobs:                                      # jobs run at the same time, each on its own machine
  backend:                                 # job 1 — the .NET side
    runs-on: ubuntu-latest                 # a brand-new Linux machine, thrown away when done
    steps:                                 # steps run one after another, top to bottom
      - name: Checkout code                # copy the repo onto the machine (it starts empty)
        uses: actions/checkout@v4          # "uses" = run a ready-made action someone else wrote

      - name: Setup .NET                   # the machine has no .NET — install it
        uses: actions/setup-dotnet@v4
        with:                              # "with" = settings for the action above
          dotnet-version: 10.0.x           # .NET 10, newest patch ("x" = whatever is latest)

      - name: Restore                      # download the NuGet packages the code needs
        run: dotnet restore StayPilot/StayPilot.slnx   # "run" = a plain command in the shell

      - name: Build                        # compile the code
        run: dotnet build StayPilot/StayPilot.slnx --no-restore -c Release   # --no-restore = reuse the step above

      - name: Test                         # run the unit tests
        run: dotnet test StayPilot/StayPilot.slnx --no-build -c Release      # --no-build = reuse the build above

  frontend:                                # job 2 — the Angular side, runs in parallel with backend
    runs-on: ubuntu-latest                 # its own separate machine
    steps:
      - name: Checkout code                # every job starts empty, so check out again here
        uses: actions/checkout@v4

      - name: Setup node                   # install Node so "npm" exists
        uses: actions/setup-node@v4
        with:
          node-version: 20.x               # Node 20, newest patch

      - name: Install                      # download the npm packages
        working-directory: './StayPilot/StayPilot.Web'   # run this command inside the Angular folder
        run: npm ci                        # "ci" = install exactly what package-lock.json pins

      - name: Build                        # turn Angular into plain HTML/CSS/JS
        working-directory: './StayPilot/StayPilot.Web'
        run: npm run build
