name: deploy-web                                  # the name you see in the Actions tab
                                                  # this workflow ships the ANGULAR site into Azure

on:                                               # when does this workflow run?
    push:                                         # after a commit lands on...
        branches: [ master, stable, release ]     # ...any of the three environment branches
        paths:                                    # and only if one of these changed
        - 'StayPilot/StayPilot.Web/**'            # the Angular project
        - '.github/workflows/deploy-web.yml'      # ...or this workflow itself
    workflow_dispatch:                            # plus a manual "Run workflow" button

permissions:                                     # what this workflow is allowed to do
    contents: read                               # read the repo (needed to check it out)
    id-token: write                              # create the short-lived token used to log into Azure

jobs:
    resolve:                                      # job 1: turn the branch name into an environment name
        runs-on: ubuntu-latest
        outputs:
            target: ${{ steps.map.outputs.target }}   # this is how job 2 receives the answer
        steps:
            - name: Map branch to environment
              id: map
              run: |
                case "${{ github.ref_name }}" in
                  master)  echo "target=dev"  >> "$GITHUB_OUTPUT" ;;
                  stable)  echo "target=qa"   >> "$GITHUB_OUTPUT" ;;
                  release) echo "target=prod" >> "$GITHUB_OUTPUT" ;;
                  *)
                    echo "::error::Branch '${{ github.ref_name }}' has no environment mapped"
                    exit 1
                    ;;
                esac

    deploy:                                            # job 2: build that environment's site
        needs: resolve                                 # wait for resolve to finish and hand us its answer
        environment: ${{ needs.resolve.outputs.target }}   # dev/qa/prod — picks the right secrets + prod's approval gate
        runs-on: ubuntu-latest                         # brand-new Linux machine (note: file names are case-sensitive here)
        env:
            TARGET: ${{ needs.resolve.outputs.target }}     # same value, as a plain shell var for later steps
        steps:
            - name: Checkout code                # copy the repo onto the machine
              uses: actions/checkout@v4

            - name: Setup node                   # the machine has no Node — install it so "npm" exists
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x             # Node 20, newest patch

            - name: Install                      # download the npm packages
              working-directory: './StayPilot/StayPilot.Web'   # run this command inside the Angular folder
              run: npm ci                        # "ci" = install exactly what package-lock.json pins

            - name: Build                        # turn Angular into plain HTML/CSS/JS
              working-directory: './StayPilot/StayPilot.Web'
              run: |
                if [ "$TARGET" = "dev" ]; then
                  npm run build                                          # no extra config — dev IS the default
                else
                  npm run build -- --configuration=production,$TARGET    # layer qa/prod's file-swap on top
                fi

            - name: Log into Azure (OIDC)        # sign in with NO stored password
              uses: azure/login@v2               # GitHub proves who it is; Azure hands back an access token
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}              # which identity in Azure we are
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}              # which Azure directory it lives in
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}  # which subscription gets billed

            - name: Get deployment token         # the upload below needs the site's own key
              id: swa                            # names this step so later steps can read its output
              run: |
                # Ask Azure for the key instead of storing it in GitHub.
                # Why: a stored key goes stale the moment the site is recreated.
                # This always gets the current one, so there is nothing to rotate.
                TOKEN=$(az staticwebapp secrets list \
                  --name "web-staypilot-$TARGET" \
                  --resource-group "rg-staypilot-$TARGET" \
                  --query "properties.apiKey" -o tsv)
                echo "::add-mask::$TOKEN"                 # hide it everywhere in the logs
                echo "token=$TOKEN" >> $GITHUB_OUTPUT     # hand it to the next step (each step is its own shell)

            - name: Deploy Web App to Azure
              uses: azure/static-web-apps-deploy@v1       # uploads files to the Static Web App
              with:
                  azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}   # the key fetched above — never stored
                  action: "upload"                                                  # upload files (not "close", used for PR previews)
                  app_location: "StayPilot/StayPilot.Web/dist/stay-pilot.web/browser"   # the finished files. NOTE the "browser" folder — Angular 17+ splits its output
                  output_location: ""                                               # empty because app_location already points at the built files
                  skip_app_build: true                                              # don't rebuild — we already built it above
