name: infra                                       # the name you see in the Actions tab
                                                  # this workflow builds the Azure RESOURCES (not the code)

on:                                               # when does this workflow run?
    push:                                         # after a commit lands on...
        branches: [ master, stable, release ]     # ...all the branches — so after a PR is merged, not before
        paths:                                    # and only if one of these files changed
             - 'infra/**'                         # the Bicep files that describe the resources
             - '.github/workflows/infra.yml'      # ...or this workflow itself
    workflow_dispatch:                            # plus a manual "Run workflow" button in the UI

permissions:                                     # what this workflow is allowed to do
    id-token: write                              # create the short-lived token used to log into Azure
    contents: read                               # read the repo (needed to check it out)

jobs:
    resolve:                                      # job 1: turn the branch name into an environment name
        runs-on: ubuntu-latest
        outputs:
            target: ${{ steps.map.outputs.target }}   # this is how job 2 receives the answer
        steps:
            - name: Map branch to environment
              id: map
              run: |
                case "${{ github.ref_name }}" in
                  master)  echo "target=dev"  >> "$GITHUB_OUTPUT" ;;
                  stable)  echo "target=qa"   >> "$GITHUB_OUTPUT" ;;
                  release) echo "target=prod" >> "$GITHUB_OUTPUT" ;;
                  *)
                    echo "::error::Branch '${{ github.ref_name }}' has no environment mapped"
                    exit 1
                    ;;
                esac
    deploy:                                      # job 2: build that environment's resources
        needs: resolve                           # wait for resolve to finish and hand us its answer
        environment: ${{ needs.resolve.outputs.target }}   # dev/qa/prod — picks that environment's secrets,
                                                             # and is what makes the prod approval gate kick in

        runs-on: ubuntu-latest                   # a brand-new Linux machine, thrown away when done
        env:
            TARGET: ${{ needs.resolve.outputs.target }}   # same value, as a plain shell var for the run: step below
        steps:
            - name: Check out the repo           # copy the repo onto the machine
              uses: actions/checkout@v4

            - name: Log into Azure (OIDC)        # sign in with NO stored password
              uses: azure/login@v2               # GitHub proves who it is; Azure hands back an access token
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}              # which identity in Azure we are
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}              # which Azure directory it lives in
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}  # which subscription gets billed

            - name: Deploy the Bicep blueprint   # make Azure match what main.bicep describes
              env:                               # "env" = variables available only in this step
                SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}   # DB password, stored in GitHub secrets
              run: |                             # "|" = a small multi-line shell script
                # "deployment group create" = make this resource group match this file.
                #   --resource-group = where to build      --template-file = what to build
                #   --parameters     = env picks the resource names + DB shape inside main.bicep;
                #                      sqlAdminPassword fills the @secure() param it asks for
                # Safe to re-run: it only adds/updates, never deletes.
                az deployment group create \
                  --resource-group "rg-staypilot-$TARGET" \
                  --template-file infra/main.bicep \
                  --parameters env="$TARGET" sqlAdminPassword="$SQL_ADMIN_PASSWORD"
